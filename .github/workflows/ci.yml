name: CI 门禁

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: 静态检查 + 规则集 Schema + 引擎冒烟
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: 第 1 步 静态检查（ruff）
        run: ruff check src

      - name: 第 2 步 规则集 Schema 校验
        run: |
          python - <<'PY'
          import json, yaml, jsonschema
          schema = json.load(open("src/cli/codereview/rules/schema.json", encoding="utf-8"))
          data = yaml.safe_load(open("src/cli/codereview/rules/default.yaml", encoding="utf-8"))
          jsonschema.validate(data, schema)
          print("规则集 Schema 校验通过，共 %d 条规则" % len(data["rules"]))
          PY

      - name: 第 3 步 引擎冒烟（样例 diff）
        run: |
          mkdir -p .ci
          python - <<'PY'
          import json
          diff = [{"file": "demo/service.py",
                   "addedLines": [{"line": 12, "text": "print('debug')"},
                                  {"line": 15, "text": "eval(user_input)"}]}]
          json.dump(diff, open(".ci/diff.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          python -m src.cli.codereview.cli \
            --rules src/cli/codereview/rules/default.yaml \
            --schema src/cli/codereview/rules/schema.json \
            --diff .ci/diff.json | tee .ci/result.json
